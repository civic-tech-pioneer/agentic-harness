# <project>/factory/config.toml: the factory's settings for this project (.claude/factory/README.md).
# Scripts read the `key = "value"` lines with sed: keep each on one line.

# The GitHub repository: cloud foremen clone it, the ruleset guards its main.
repo = "civic-tech-pioneer/<name>"

# The task gate: run from the project root by check.sh after every implementer run, and by CI.
# Exit 0 passes. TASK and BASE are set (the task id, the commit the task started from).
# A watane mod: the factory's mod gate (watane-dev doctor, then its contract tests).
gate = ".claude/factory/check-mod.sh"

# The Anthropic cloud environment for cloud foremen.
cloud_env = "env_01KZVAm2cjSpN4wbfAFeQNPD"

# The Codex Cloud environment that Codex teams run in: its name in the environment picker of
# chatgpt.com/codex (the deputy dispatches through its browser pane; deputy skill, section 4c). It must hold
# this repository. Leave it out and both teams of a cloud slice are Claude.
# codex_env = "watane"

# The model a Claude team runs on.
foreman_model = "claude-opus-5-5"

# The spec chain, why > what > how: the priority of truth, highest first. Code comes after.
spec = ["spec/VISION.md", "spec/FUNCTIONAL.md", "spec/TECHNICAL.md"]

# The section that lists the project's security boundaries, each with the FILES that hold it (paths
# or path prefixes, present or planned): the foreman matches a slice's diff against them.
# A slice whose diff touches one of those files gets the adversary. Empty: no boundaries yet.
boundaries = "spec/TECHNICAL.md section 6"

# The team. Leave it out for the default (deputy skill, "Who builds, who reviews"): Codex builds
# two slices in three, the other vendor reviews. Set only what this repository needs otherwise.
# builder: "codex" or "claude", always this builder. reviewer: the same, always this reviewer.
# [team]
# builder = "codex"
# reviewer = "claude"

[agents]
# A Claude build team uses the agent named in implementer_cloud; a Codex build team implements itself.
implementer_cloud = "implementer"
validator = "validator"
acceptance = "user-sim"
adversary = "adversary"
