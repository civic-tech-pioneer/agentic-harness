[package]
name = "agent-mod"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "The agent kernel as a watane mod: the WIT world (mods:agent@0.1.0) over the agent-kernel crate (TECHNICAL 1, 2.1, 2.3)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-kernel = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "=0.63.0"
