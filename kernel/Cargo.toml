[workspace]
members = [".", "wasm"]
default-members = [".", "wasm"]

[package]
name = "agent-kernel"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "The agent kernel's error type and profile check, and the transcript over host state (TECHNICAL 9.1, 9.2, 9.4, 11, 12)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
claude-codes = { version = "=2.1.330", default-features = false, features = ["types"] }
agent-client-protocol-schema = { version = "=1.20.0", default-features = false }
url = "=2.5.4"
