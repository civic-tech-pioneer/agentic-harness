[package]
name = "agent-kernel"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "The agent kernel's error type and profile check (TECHNICAL 9.2, 11, 12)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
claude-codes = { version = "=2.1.330", default-features = false, features = ["types"] }
agent-client-protocol-schema = "=1.20.0"
