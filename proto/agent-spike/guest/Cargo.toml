[package]
name = "agent-spike-guest"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"
wstd = "0.6.8"
http-body-util = "0.1"
sse-stream = "0.3"
futures-util = { version = "0.3", default-features = false }
serde_json = "1"
agent-client-protocol-schema = "1.19"
claude-codes = { version = "=2.1.330", default-features = false, features = ["types"] }
