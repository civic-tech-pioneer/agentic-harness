[package]
name = "agent-spike-host"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
wasmtime = "=48.0.9"
wasmtime-wasi = "=48.0.9"
wasmtime-wasi-http = "=48.0.9"
anyhow = "1"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
http = "1"
http-body-util = "0.1"
tiny_http = "0.12"
