# <project>/factory/config.toml: the factory's settings for this project (.claude/factory/README.md).
# Scripts read the `key = "value"` lines with sed: keep each on one line.

# The GitHub repository: cloud foremen clone it, the ruleset guards its main.
repo = "civic-tech-pioneer/agentic-harness"

# The task gate: run from the project root by check.sh after every implementer run, and by CI.
# Exit 0 passes. TASK and BASE are set (the task id, the commit the task started from).
# Runs check-mod.sh (links, mod contract), then the kernel crate and the console when they exist.
gate = "factory/gate.sh"

# The Anthropic cloud environment for cloud foremen.
cloud_env = "env_01KZVAm2cjSpN4wbfAFeQNPD"

# The Codex Cloud environment Codex teams run in: its name in the picker of chatgpt.com/codex.
codex_env = "watane"

# The model a Claude team runs on.
foreman_model = "claude-opus-5-5"

# The spec chain, why > what > how: the priority of truth, highest first. Code comes after.
spec = ["design/VISION.md", "design/FUNCTIONAL.md", "design/TECHNICAL.md"]

# The section that lists the project's security boundaries, each with the files that hold it.
# A slice whose diff touches one of those files gets the adversary. Empty: no boundaries yet.
boundaries = "design/TECHNICAL.md section 14"

[agents]
# A Claude build team uses the agent named in implementer_cloud; a Codex build team implements itself.
implementer_cloud = "implementer"
validator = "validator"
acceptance = "user-sim"
adversary = "adversary"
